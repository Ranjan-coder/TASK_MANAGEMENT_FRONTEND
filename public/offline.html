<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Offline — Bonito</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #020617; color: #cbd5e1; font: 15px/1.5 system-ui, sans-serif; padding: 16px; box-sizing: border-box; }
  main { max-width: 360px; text-align: center; }
  img { width: 72px; height: 72px; border-radius: 18px; }
  h1 { color: #fff; font-size: 20px; margin: 16px 0 4px; }
  button { margin-top: 16px; padding: 10px 18px; border: 0; border-radius: 10px; background: #7c3aed; color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
</style>
</head>
<body>
<main>
  <img src="/icons/icon-192.png" alt="" />
  <h1>You're offline</h1>
  <p>Bonito needs an internet connection. Your chats are safe — they'll load when you're back online.</p>
  <button onclick="location.reload()">Try again</button>
</main>
</body>
</html>
